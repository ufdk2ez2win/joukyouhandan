<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>キャン太2 状況判断例題ジェネレータ</title>
    <style>
        :root {
            --bg-color: #121212;
            --panel-bg: #1e1e1e;
            --accent-color: #ff9900;
            --hp-color: #2ecc71;
            --stun-color: #f1c40f;
            --gauge-color: #3498db;
            --text-color: #ffffff;
            --border-color: #333333;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 10px;
            max-width: 900px;
            margin: 0 auto;
        }

        h1 {
            color: var(--accent-color);
            text-align: center;
            font-size: 1.2rem;
            margin-bottom: 15px;
            line-height: 1.4;
        }

        @media (min-width: 600px) {
            body { padding: 20px; }
            h1 { font-size: 1.4rem; margin-bottom: 20px; }
        }

        /* 設定パネル */
        .config-box {
            background: var(--panel-bg);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            border: 1px solid var(--border-color);
        }

        .team-title {
            font-weight: bold;
            margin-top: 8px;
            margin-bottom: 6px;
            color: #ddd;
            font-size: 0.85rem;
        }

        .team-select {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            margin-bottom: 12px;
        }

        select {
            padding: 6px 4px;
            background: #2a2a2a;
            color: #fff;
            border: 1px solid #444;
            border-radius: 4px;
            width: 100%;
            font-size: 0.8rem;
        }

        button {
            display: block;
            width: 100%;
            padding: 12px;
            background: var(--accent-color);
            color: #000;
            font-weight: bold;
            font-size: 1rem;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: #e68a00;
        }

        /* ゲーム画面エリア */
        .game-screen {
            background: #000;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            padding: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        @media (min-width: 600px) {
            .game-screen { padding: 20px; }
        }

        /* 画面上部：チーム・キャラ名・HP・BOKO (常に左右2列) */
        .hud-top {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
            align-items: start;
        }

        @media (min-width: 600px) {
            .hud-top { gap: 20px; margin-bottom: 20px; }
        }

        .player-info {
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .player-info.p1 { text-align: left; }
        .player-info.p2 { text-align: right; }

        /* チーム名表示：折り返しを許可 */
        .team-list-display {
            font-size: 0.65rem;
            color: #888;
            margin-bottom: 4px;
            white-space: normal;
            word-break: break-all;
            line-height: 1.2;
        }

        @media (min-width: 600px) {
            .team-list-display { font-size: 0.75rem; }
        }

        .char-name {
            font-size: 0.85rem;
            font-weight: bold;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: flex;
            align-items: center;
        }

        @media (min-width: 600px) {
            .char-name { font-size: 1.1rem; margin-bottom: 6px; }
        }

        .p1 .char-name { justify-content: flex-start; }
        .p2 .char-name { justify-content: flex-end; }

        .role-tag {
            font-size: 0.7rem;
            color: #aaa;
            margin: 0 2px;
            flex-shrink: 0;
        }

        /* ゲージ共通 */
        .bar-container {
            background: #333;
            height: 14px;
            border-radius: 2px;
            overflow: hidden;
            position: relative;
            border: 1px solid #555;
            width: 100%;
        }

        @media (min-width: 600px) {
            .bar-container { height: 18px; }
        }

        .bar-fill {
            height: 100%;
            transition: width 0.3s ease;
        }

        /* HPゲージ */
        .hp-container { height: 14px; }
        @media (min-width: 600px) {
            .hp-container { height: 20px; }
        }

        .hp-fill { background: var(--hp-color); }
        .p1 .hp-fill { float: right; }
        .p2 .hp-fill { float: left; }

        .val-text {
            font-size: 0.75rem;
            font-family: monospace;
            margin-top: 2px;
            color: #ccc;
        }

        /* BOKOゲージ */
        .stun-wrapper {
            margin-top: 4px;
            width: 70%;
        }
        @media (min-width: 600px) {
            .stun-wrapper { width: 45%; margin-top: 6px; }
        }

        .p1 .stun-wrapper { margin-left: auto; }
        .p2 .stun-wrapper { margin-right: auto; }

        .stun-container { height: 5px; }
        @media (min-width: 600px) {
            .stun-container { height: 6px; }
        }

        .stun-fill { background: var(--stun-color); }
        .p1 .stun-fill { float: right; }
        .p2 .stun-fill { float: left; }

        /* 画面中央：ステージ・立ち位置 */
        .stage-area {
            margin: 10px 0;
            background: #181818;
            border-top: 2px solid #333;
            border-bottom: 2px solid #333;
            padding: 10px 4px;
            overflow-x: auto;
        }

        .stage-title {
            text-align: center;
            font-size: 0.75rem;
            color: #888;
            margin-bottom: 6px;
        }

        .stage-track {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #0a0a0a;
            border-left: 3px solid #666;
            border-right: 3px solid #666;
            height: 32px;
            padding: 0 2px;
            position: relative;
            min-width: 280px;
        }

        .stage-grid {
            display: flex;
            width: 100%;
            justify-content: space-between;
            height: 100%;
            align-items: center;
        }

        .grid-cell {
            flex: 1;
            text-align: center;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            border-right: 1px dashed #222;
        }
        .grid-cell:last-child { border-right: none; }

        .player-icon {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.7rem;
            color: #fff;
            box-shadow: 0 0 4px rgba(0,0,0,0.8);
        }
        .p1-icon { background: #e74c3c; }
        .p2-icon { background: #3498db; }

        /* 画面下部：超必ゲージ (常に左右2列) */
        .hud-bottom {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 10px;
        }

        @media (min-width: 600px) {
            .hud-bottom { gap: 20px; margin-top: 15px; }
        }

        .meter-row {
            display: flex;
            align-items: center;
            gap: 6px;
            width: 100%;
        }

        .meter-container {
            flex: 1;
            height: 12px;
            position: relative;
        }

        @media (min-width: 600px) {
            .meter-container { height: 14px; }
        }

        .meter-fill { background: var(--gauge-color); }
        .p1 .meter-fill { float: right; }
        .p2 .meter-fill { float: left; }

        /* 0.25刻みの目盛り */
        .p1 .meter-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                to left,
                transparent,
                transparent calc(25% - 1px),
                rgba(255, 255, 255, 0.4) calc(25% - 1px),
                rgba(255, 255, 255, 0.4) 25%
            );
            z-index: 2;
            pointer-events: none;
        }

        .p2 .meter-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                to right,
                transparent,
                transparent calc(25% - 1px),
                rgba(255, 255, 255, 0.4) calc(25% - 1px),
                rgba(255, 255, 255, 0.4) 25%
            );
            z-index: 2;
            pointer-events: none;
        }

        .stock-num {
            font-size: 1rem;
            font-weight: bold;
            color: var(--accent-color);
            min-width: 14px;
            font-family: monospace;
            text-align: center;
        }

        @media (min-width: 600px) {
            .stock-num { font-size: 1.2rem; min-width: 18px; }
        }
    </style>
</head>
<body>

    <h1>ウルトラファイトだ！キャン太２<br>状況判断例題ジェネレータ</h1>

    <div class="config-box">
        <div class="team-title">■ 1P (自分) のチーム設定</div>
        <div class="team-select">
            <select id="p1-1"><option value="">-- 先鋒 --</option></select>
            <select id="p1-2"><option value="">-- 中堅 --</option></select>
            <select id="p1-3"><option value="">-- 大将 --</option></select>
        </div>

        <div class="team-title">■ 2P (相手) のチーム設定</div>
        <div class="team-select">
            <select id="p2-1"><option value="">-- 先鋒 --</option></select>
            <select id="p2-2"><option value="">-- 中堅 --</option></select>
            <select id="p2-3"><option value="">-- 大将 --</option></select>
        </div>

        <button onclick="generateQuestion()">問題を生成する</button>
    </div>

    <div class="game-screen" id="screen">
        <div style="text-align: center; color: #666; padding: 40px 0;">
            「問題を生成する」ボタンを押してください。
        </div>
    </div>

    <script>
        const CHARACTERS = [
            "キャン太", "ブットビ", "スパイク", "アンナ", "ツキナミ", "ブルース", "ジャコー",
            "センドウ", "ミシェル", "チヒロ", "東刑事", "ローグ", "レア", "ガラシャ",
            "ヒソミ", "ウェルダン", "コカーン", "ナナツ", "東ロボ", "ギャン太", "Mミシェル",
            "刀キャン太", "マサオ", "太郎", "ハトヤン", "ZackyWild", "マサ子", "kinoko",
            "ナタネー", "ドクターK", "ミュシャ", "ジャパン仮面", "グランドスカイ"
        ];

        const ROLES = ["先鋒", "中堅", "大将"];

        function initSelects() {
            const allIds = ['p1-1', 'p1-2', 'p1-3', 'p2-1', 'p2-2', 'p2-3'];
            allIds.forEach(id => {
                const select = document.getElementById(id);
                CHARACTERS.forEach(char => {
                    const opt = document.createElement('option');
                    opt.value = char;
                    opt.textContent = char;
                    select.appendChild(opt);
                });
            });
        }

        function getRandomItem(arr) {
            return arr[Math.floor(Math.random() * arr.length)];
        }

        function buildTeam(selectIds, playerLabel) {
            let selected = selectIds.map(id => document.getElementById(id).value).filter(v => v !== "");
            if (new Set(selected).size !== selected.length) {
                alert(`${playerLabel} のチーム内でキャラクターが重複しています。`);
                return null;
            }

            let available = CHARACTERS.filter(c => !selected.includes(c));
            return selectIds.map(id => {
                let val = document.getElementById(id).value;
                if (val) return val;
                let randomChar = getRandomItem(available);
                available = available.filter(c => c !== randomChar);
                return randomChar;
            });
        }

        function getWeightedRolePair() {
            const pairs = [
                [0, 0, 25], [1, 1, 25], 
                [0, 1, 15], [1, 0, 15], [1, 2, 8], [2, 1, 8],
                [2, 2, 3],
                [0, 2, 1], [2, 0, 1]
            ];

            const totalWeight = pairs.reduce((sum, item) => sum + item[2], 0);
            let randomNum = Math.random() * totalWeight;

            for (const item of pairs) {
                if (randomNum < item[2]) {
                    return [item[0], item[1]];
                }
                randomNum -= item[2];
            }
            return [0, 0];
        }

        function generateGaugeVal(roleIndex) {
            if (roleIndex === 0) {
                return (Math.random() * 1.50).toFixed(2);
            } else if (roleIndex === 1) {
                const rand1 = Math.random();
                const rand2 = Math.random();
                const weightedVal = ((rand1 + rand2) / 2) * 3.7;
                return Math.min(3.99, weightedVal).toFixed(2);
            }
            return (Math.random() * 3.99).toFixed(2);
        }

        function generateQuestion() {
            const p1Team = buildTeam(['p1-1', 'p1-2', 'p1-3'], '1P(自分)');
            if (!p1Team) return;

            const p2Team = buildTeam(['p2-1', 'p2-2', 'p2-3'], '2P(相手)');
            if (!p2Team) return;

            const [p1Idx, p2Idx] = getWeightedRolePair();

            const maxDistance = Math.floor(20 * 0.6);
            const p1Pos = Math.floor(Math.random() * 19);
            const minP2 = p1Pos + 1;
            const maxP2 = Math.min(19, p1Pos + maxDistance);
            const p2Pos = minP2 + Math.floor(Math.random() * (maxP2 - minP2 + 1));

            const p1Hp = Math.floor(Math.random() * 100) + 1;
            const p2Hp = Math.floor(Math.random() * 100) + 1;

            const p1Stun = Math.floor(Math.random() * 20) * 5;
            const p2Stun = Math.floor(Math.random() * 20) * 5;

            const p1Gauge = generateGaugeVal(p1Idx);
            const p2Gauge = generateGaugeVal(p2Idx);

            const p1BarPercent = (p1Gauge % 1) * 100;
            const p1Stock = Math.floor(p1Gauge);

            const p2BarPercent = (p2Gauge % 1) * 100;
            const p2Stock = Math.floor(p2Gauge);

            let gridHTML = "";
            for (let i = 0; i < 20; i++) {
                gridHTML += `<div class="grid-cell">`;
                if (i === p1Pos) gridHTML += `<div class="player-icon p1-icon">1</div>`;
                if (i === p2Pos) gridHTML += `<div class="player-icon p2-icon">2</div>`;
                gridHTML += `</div>`;
            }

            const html = `
                <!-- 画面上部 HUD (チーム・HP・BOKO) -->
                <div class="hud-top">
                    <!-- 1P (自分) -->
                    <div class="player-info p1">
                        <div class="team-list-display">チーム: ${p1Team.join(" / ")}</div>
                        <div class="char-name">1P: ${p1Team[p1Idx]} <span class="role-tag">(${ROLES[p1Idx]})</span></div>
                        <div class="bar-container hp-container">
                            <div class="bar-fill hp-fill" style="width: ${p1Hp}%;"></div>
                        </div>
                        <div class="val-text">HP: ${p1Hp}%</div>

                        <div class="stun-wrapper">
                            <div class="bar-container stun-container">
                                <div class="bar-fill stun-fill" style="width: ${p1Stun}%;"></div>
                            </div>
                            <div class="val-text">BOKO: ${p1Stun}%</div>
                        </div>
                    </div>

                    <!-- 2P (相手) -->
                    <div class="player-info p2">
                        <div class="team-list-display">チーム: ${p2Team.join(" / ")}</div>
                        <div class="char-name"><span class="role-tag">(${ROLES[p2Idx]})</span> ${p2Team[p2Idx]} :2P</div>
                        <div class="bar-container hp-container">
                            <div class="bar-fill hp-fill" style="width: ${p2Hp}%;"></div>
                        </div>
                        <div class="val-text">HP: ${p2Hp}%</div>

                        <div class="stun-wrapper">
                            <div class="bar-container stun-container">
                                <div class="bar-fill stun-fill" style="width: ${p2Stun}%;"></div>
                            </div>
                            <div class="val-text">BOKO: ${p2Stun}%</div>
                        </div>
                    </div>
                </div>

                <!-- 画面中央 (ステージ・立ち位置) -->
                <div class="stage-area">
                    <div class="stage-title">【 画面状況 (立ち位置) 】</div>
                    <div class="stage-track">
                        <div class="stage-grid">
                            ${gridHTML}
                        </div>
                    </div>
                </div>

                <!-- 画面下部 HUD (ゲージ) -->
                <div class="hud-bottom">
                    <!-- 1P: [ストック(左端)] [ゲージ] -->
                    <div class="player-info p1">
                        <div class="meter-row">
                            <div class="stock-num">${p1Stock}</div>
                            <div class="bar-container meter-container">
                                <div class="bar-fill meter-fill" style="width: ${p1BarPercent}%;"></div>
                            </div>
                        </div>
                        <div class="val-text">ゲージ: ${p1Gauge}本</div>
                    </div>

                    <!-- 2P: [ゲージ] [ストック(右端)] -->
                    <div class="player-info p2">
                        <div class="meter-row">
                            <div class="bar-container meter-container">
                                <div class="bar-fill meter-fill" style="width: ${p2BarPercent}%;"></div>
                            </div>
                            <div class="stock-num">${p2Stock}</div>
                        </div>
                        <div class="val-text">ゲージ: ${p2Gauge}本</div>
                    </div>
                </div>
            `;

            document.getElementById('screen').innerHTML = html;
        }

        initSelects();
    </script>
</body>
</html>
</html>
</body>
</html>
